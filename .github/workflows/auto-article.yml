# Deploy: günlük makale → main commit → hostinger-deploy publish
#
# Akış:
#   1. npm run generate:article
#   2. npm run build
#   3. content/articles + public/sitemap.xml → main'e commit/push
#   4. dist/ → hostinger-deploy branch köküne publish
#
# Hostinger: branch hostinger-deploy, build None, output boş

name: Daily Auto Article

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-build-deploy:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      SITE_URL: https://sumerhukuk.com
      SITE_NAME: Sümer Hukuk Bürosu
      SITE_DOMAIN: sumerhukuk.com
      DEFAULT_LANGUAGE: tr
      ARTICLE_AUTHOR: Sümer Hukuk Bürosu
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        run: npm run generate:article

      - name: Build site
        run: npm run build

      - name: Commit generated content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Kalite uyarıları generate adımını düşürmez; dosya varsa commit/push devam eder.
          if ! ls content/articles/*.json >/dev/null 2>&1; then
            echo "::error title=Teknik hata::content/articles altında makale dosyası yok"
            exit 1
          fi
          git add content/articles public/sitemap.xml
          git diff --staged --quiet || git commit -m "chore: otomatik hukuk makalesi eklendi"
          git push

      - name: Publish dist to hostinger-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy latest build to Hostinger"
