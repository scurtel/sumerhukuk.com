# Deploy: main → GitHub Actions build → hostinger-deploy → Hostinger
#
# Bu workflow:
#   1. npm ci
#   2. npm run build  (çıktı: dist/)
#   3. dist/ içeriğini hostinger-deploy branch köküne publish eder
#
# Hostinger ayarı:
#   Branch: hostinger-deploy
#   Build: None
#   Output directory: boş (/)
#
# main branch + npm run build kullanılırsa dist içinde kalır → 403 riski.
# Alternatif: npm run build:hostinger (bkz. README.md)

name: Build Static Site for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Publish dist to hostinger-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy static site to Hostinger"
